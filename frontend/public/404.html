<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | GYM3</title>
    <style>
      :root {
        --bg: #0b0f14;
        --panel: #121a22;
        --text: #edf6ff;
        --muted: #99a7b3;
        --accent: #d4a73d;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, rgba(212, 167, 61, 0.18), transparent 30%), var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .card {
        width: min(90vw, 560px);
        background: rgba(18, 26, 34, 0.9);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        padding: 48px 32px;
        text-align: center;
        box-shadow: 0 30px 60px rgba(0,0,0,0.35);
      }

      .code {
        font-size: 72px;
        line-height: 1;
        margin: 0 0 16px;
        color: var(--accent);
        font-weight: 700;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.7;
      }

      a {
        display: inline-block;
        padding: 12px 22px;
        background: var(--accent);
        color: #111827;
        text-decoration: none;
        border-radius: 999px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="code">404</div>
      <h1>Page not found</h1>
      <p>The page you are looking for does not exist or may have been moved.</p>
      <a href="/">Go back home</a>
    </main>
  </body>
</html>
